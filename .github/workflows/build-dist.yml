name: 自动构建前端dist文件夹
# 触发条件：推代码到main分支、打Tag时自动执行；也支持手动触发
on:
  push:
    branches: [ main ]          # 推main分支触发
    tags: [ 'v*' ]              # 打v开头的Tag触发（修正：缩进到push子级）
  workflow_dispatch:            # 手动触发（独立层级）

jobs:
  build-dist:
    runs-on: ubuntu-latest      # 使用GitHub的Ubuntu服务器构建
    steps:
      # 1. 检出仓库代码到构建服务器
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 配置Node.js环境（匹配Vue项目依赖的版本）
      - name: 设置Node.js版本
        uses: actions/setup-node@v4
        with:
          node-version: '18'     # 按需调整（Vue2常用16，Vue3常用18/20）
          cache: 'npm'           # 缓存npm依赖，加速后续构建

      # 3. 进入Vue项目目录，安装依赖并打包生成dist
      - name: 安装依赖 & 打包前端
        working-directory: ./xyzw_web_helper  # 你的Vue项目根目录（确认路径正确）
        run: |
          # 国内环境可加镜像源加速：npm install --registry=https://registry.npmmirror.com
          npm install
          npm run build  # 执行package.json里的build脚本

      # 4. 上传dist文件夹到GitHub Actions产物，方便下载
      - name: 上传dist文件夹
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist  # 产物名称（下载时显示）
          path: ./xyzw_web_helper/dist  # dist文件夹路径（匹配项目结构）

      # 【可选】打Tag时，把dist包上传到GitHub Release
      - name: 打包dist为ZIP并上传到Release
        if: startsWith(github.ref, 'refs/tags/')  # 仅打Tag时执行
        run: |
          cd ./xyzw_web_helper
          zip -r ../xyzw-web-helper-dist-${{ github.ref_name }}.zip dist/
      - name: 创建GitHub Release并上传ZIP包
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: xyzw-web-helper-dist-${{ github.ref_name }}.zip
          body: |
            自动构建的前端dist包（${{ github.ref_name }}版本）
            - 解压后可直接部署到Nginx/Apache等静态服务器
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
