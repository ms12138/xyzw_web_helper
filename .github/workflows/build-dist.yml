name: 自动构建前端dist文件夹

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 版本
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 配置 npm 镜像
        run: npm config set registry https://registry.npmmirror.com

      - name: 安装依赖 & 打包前端
        run: |
          npm install
          npm run build

      - name: 上传 dist 文件夹
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: 打包 dist 为 ZIP
        if: startsWith(github.ref, 'refs/tags/')
        run: zip -r xyzw-web-helper-dist-${{ github.ref_name }}.zip dist/

      - name: 创建 GitHub Release 并上传 ZIP
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: xyzw-web-helper-dist-${{ github.ref_name }}.zip
          body: |
            自动构建的前端 dist 包（${{ github.ref_name }} 版本）
            - 解压后可直接部署到 Nginx / Apache 等静态服务器
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
